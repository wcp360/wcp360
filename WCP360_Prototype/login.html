<!doctype html>
<html lang="fr" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connexion de démonstration — WCP360</title>
  <link rel="stylesheet" href="assets/reference-ui.css">
  <link rel="stylesheet" href="assets/foundation.css">
  <link rel="stylesheet" href="assets/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card" id="main-content" aria-labelledby="auth-title">
    <a class="auth-brand" href="index.html" aria-label="WCP360, accueil du prototype"><span class="auth-brandmark" aria-hidden="true">360</span><span>WCP<strong>360</strong></span></a>
    <p class="auth-eyebrow">EXPLORER LE PROTOTYPE</p>
    <h1 id="auth-title">Votre espace de travail.</h1>
    <p class="auth-lead">Choisissez un portail pour explorer ses outils et ses parcours.</p>
    <aside class="auth-notice" aria-label="Mode démonstration"><strong>Démonstration locale</strong><p>Cette connexion simule un parcours. Utilisez uniquement les identifiants fictifs ci-dessous.</p></aside>
    <form class="wcp-ui-form auth-form" action="mfa.html" method="get" autocomplete="off" data-auth-form>
      <label class="wcp-ui-field" for="login-identity">Adresse de démonstration
        <input id="login-identity" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" required value="admin@example.com" aria-describedby="login-identity-help">
        <span class="wcp-ui-field-help" id="login-identity-help">Identifiant fictif : admin@example.com</span>
      </label>
      <label class="wcp-ui-field" for="login-password">Mot de passe de démonstration
        <input id="login-password" type="password" autocomplete="off" required value="demo-wcp360" aria-describedby="login-password-help">
        <span class="wcp-ui-field-help" id="login-password-help">Valeur de test : demo-wcp360</span>
      </label>
      <p class="auth-feedback" data-auth-feedback role="status" aria-live="polite" hidden></p>
      <button type="submit" class="wcp-ui-button primary auth-submit" disabled>Continuer la démonstration</button>
    </form>
    <noscript><p class="auth-notice">Activez JavaScript pour suivre le parcours simulé. Vous pouvez aussi <a href="index.html">explorer le catalogue</a>.</p></noscript>
    <footer class="auth-footer"><a href="index.html">Retour au prototype</a><span>Aucune authentification réelle</span></footer>
  </main>
  <script src="assets/foundation.js"></script>
  <script src="assets/reference-ui.js"></script>
  <script src="assets/auth-runtime.js"></script>
</body>
</html>
