<!doctype html>
<html lang="fr" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Vérification de démonstration — WCP360</title>
  <link rel="stylesheet" href="assets/reference-ui.css">
  <link rel="stylesheet" href="assets/foundation.css">
  <link rel="stylesheet" href="assets/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card" id="main-content" aria-labelledby="auth-title">
    <a class="auth-brand" href="index.html" aria-label="WCP360, accueil du prototype"><span class="auth-brandmark" aria-hidden="true">360</span><span>WCP<strong>360</strong></span></a>
    <p class="auth-eyebrow">ÉTAPE 2 SUR 2</p>
    <h1 id="auth-title">Vérification simulée.</h1>
    <p class="auth-lead">Découvrez la seconde étape de connexion avec un code fictif.</p>
    <aside class="auth-notice" aria-label="Mode démonstration"><strong>Démonstration locale</strong><p>Aucun code n’est envoyé. Le code de test est <b>123456</b> ; le code de récupération est <b>DEMO-RECOVERY</b>.</p></aside>
    <form class="wcp-ui-form auth-form" action="canonical-user-dashboard.html" method="get" autocomplete="off" data-auth-form>
      <label class="wcp-ui-field" for="mfa-code"><span data-auth-code-label>Code de démonstration à 6 chiffres</span>
        <input id="mfa-code" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="123456" required aria-describedby="mfa-code-help">
        <span class="wcp-ui-field-help" id="mfa-code-help" data-auth-code-help>Saisissez 123456 pour continuer.</span>
      </label>
      <p class="auth-feedback" data-auth-feedback role="status" aria-live="polite" hidden></p>
      <button type="submit" class="wcp-ui-button primary auth-submit" disabled>Ouvrir le portail de démonstration</button>
      <button type="button" class="wcp-ui-button" data-auth-recovery aria-pressed="false">Utiliser le code de récupération</button>
    </form>
    <noscript><p class="auth-notice">Activez JavaScript pour suivre le parcours simulé. Vous pouvez aussi <a href="index.html">explorer le catalogue</a>.</p></noscript>
    <footer class="auth-footer"><a href="login.html">Changer de portail</a><span>Aucune authentification réelle</span></footer>
  </main>
  <script src="assets/foundation.js"></script>
  <script src="assets/reference-ui.js"></script>
  <script src="assets/auth-runtime.js"></script>
</body>
</html>
