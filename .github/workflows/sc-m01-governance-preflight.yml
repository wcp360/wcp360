name: SC-M01 input fingerprints (current relocation and historical fixtures)

on:
  push:
    branches: [main]
    paths:
      - "tools/governance/**"
      - "documentation/governance/verification/**"
      - "documentation/specifications/**"
      - ".github/workflows/sc-m01-governance-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/governance/**"
      - "documentation/governance/verification/**"
      - "documentation/specifications/**"
      - ".github/workflows/sc-m01-governance-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout without credentials and retain pinned historical objects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test relocated-input and private-export refusal cases
        run: python3 -m unittest discover -s tools/governance -p 'test_sc_m01_historical_inputs.py' -v
      - name: Verify five required current relocated byte pins (not Core approval)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scm01-evidence"
          python3 tools/governance/sc_m01_historical_inputs.py --verify-current > "$RUNNER_TEMP/scm01-evidence/current-relocated-inputs.json"
      - name: Materialize fixed historical inputs outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/governance/sc_m01_historical_inputs.py --output "$RUNNER_TEMP/scm01-inputs" > "$RUNNER_TEMP/scm01-evidence/historical-provenance.json"
      - name: Execute original preflight assertions against historical bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "$RUNNER_TEMP/scm01-inputs/tools/governance" -p 'test_sc_m01_preflight.py' -v
          python3 "$RUNNER_TEMP/scm01-inputs/tools/governance/sc_m01_preflight.py" --format json --require-all-pinned > "$RUNNER_TEMP/scm01-evidence/historical-eight-pins.json"
      - name: Preserve explicitly scoped fingerprint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scm01-fingerprints-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scm01-evidence/*.json
          if-no-files-found: error
          retention-days: 30

# Exact bytes are source evidence, never owner approval, E3 or product qualification.
