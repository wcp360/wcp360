name: SC-M01 inert daemon foundation
on:
  pull_request:
    paths: ['SOURCE/**', 'documentation/specifications/**', '.github/workflows/sc-m01-daemon-foundation.yml']
  push:
    branches: ['main', 'implementation/core-executable-foundation-20261031', 'source/**', 'test/sc-m01-cli-process-contract']
    paths: ['SOURCE/**', 'documentation/specifications/**', '.github/workflows/sc-m01-daemon-foundation.yml']
permissions:
  contents: read
concurrency:
  group: sc-m01-daemon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  daemon-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GO_VERSION: '1.27.3'
      GO_ARCHIVE_SHA256: '65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40'
      DEBIAN_IMAGE: 'debian@sha256:918311b7b6c4c6f68b232ba516584925f6c78ad82b6fd534b98979df6438e483'
    steps:
      - name: Read-only checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Assemble trusted pinned toolchain (no product execution)
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$RUNNER_TEMP/wcp-foundation"
          mkdir -p "$task_dir/builder" "$task_dir/source" "$task_dir/out/sc-m01/daemon"
          printf '%s\n' "$task_dir" > "$RUNNER_TEMP/wcp-task-dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "$task_dir/go.tar.gz"
          printf '%s  %s\n' "$GO_ARCHIVE_SHA256" "$task_dir/go.tar.gz" | sha256sum --check
          tar -xzf "$task_dir/go.tar.gz" -C "$task_dir/builder"
          mkdir -p "$task_dir/builder/tools"
          export GOTOOLCHAIN=local GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org
          export GOPRIVATE= GONOSUMDB= GOTOOLCHAIN=local CGO_ENABLED=0
          export GOMODCACHE="$task_dir/scanner-module-cache" GOCACHE="$task_dir/scanner-build-cache"
          env GOTOOLCHAIN=local GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            GOPRIVATE= GONOSUMDB= GOBIN="$task_dir/builder/tools" \
            "$task_dir/builder/go/bin/go" install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$task_dir/builder/go/bin/go" version -m "$task_dir/builder/tools/govulncheck" \
            > "$task_dir/out/sc-m01/daemon/scanner-bootstrap.txt"
          # The checked-in inventory is candidate data: compare it; never execute it.
          awk '$1 == "mod" || $1 == "dep" {print $2 " " $3 " " $4}' \
            "$task_dir/out/sc-m01/daemon/scanner-bootstrap.txt" | LC_ALL=C sort \
            > "$task_dir/out/sc-m01/daemon/scanner-linked-modules.txt"
          diff -u SOURCE/daemon/tools/govulncheck.modules \
            "$task_dir/out/sc-m01/daemon/scanner-linked-modules.txt"
          cp SOURCE/daemon/tools/govulncheck.modules "$task_dir/out/sc-m01/daemon/scanner-module-lock.txt"
          sha256sum "$task_dir/builder/tools/govulncheck" > "$task_dir/out/sc-m01/daemon/scanner.sha256"
          awk '$1 == "mod" || $1 == "dep" {print $2 "@" $3}' \
            "$task_dir/out/sc-m01/daemon/scanner-bootstrap.txt" > "$task_dir/scanner-modules.txt"
          while read -r scanner_module; do
            "$task_dir/builder/go/bin/go" mod download -json "$scanner_module"
          done < "$task_dir/scanner-modules.txt" > "$task_dir/out/sc-m01/daemon/scanner-module-provenance.jsonl"
          "$task_dir/builder/go/bin/go" -C "$GOMODCACHE/golang.org/x/vuln@v1.9.0" mod verify \
            > "$task_dir/out/sc-m01/daemon/scanner-module-verify.txt"
          cat > "$task_dir/builder/Dockerfile" <<'DOCKERFILE'
          FROM debian@sha256:918311b7b6c4c6f68b232ba516584925f6c78ad82b6fd534b98979df6438e483
          COPY go/ /opt/go/
          COPY tools/ /opt/tools/
          ENV PATH="/opt/go/bin:/opt/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          USER 10001:10001
          WORKDIR /workspace
          DOCKERFILE
          docker pull --platform linux/amd64 "$DEBIAN_IMAGE"
          docker build --no-cache --network=none --platform linux/amd64 \
            --tag wcp-foundation-ci "$task_dir/builder"
          git archive --format=tar HEAD > "$task_dir/source.tar"
          tar -xf "$task_dir/source.tar" -C "$task_dir/source"
          mkdir -p "$task_dir/source/out"
          chmod -R a+rX "$task_dir/source"
          {
            printf 'tested_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'base_image=%s\ngo_archive_sha256=%s\n' "$DEBIAN_IMAGE" "$GO_ARCHIVE_SHA256"
            sha256sum "$task_dir/source.tar"
            docker image inspect --format '{{.Id}}' wcp-foundation-ci
            printf 'source_form=git-archive; VCS identity retained in evidence, not embedded\n'
          } > "$task_dir/out/sc-m01/daemon/provenance.txt"
          sudo chown -R 10001:10001 "$task_dir/out"
      - name: Canonical offline build and unit gates
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$(cat "$RUNNER_TEMP/wcp-task-dir")"
          docker run --rm --platform linux/amd64 --user 10001:10001 \
            --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --mount "type=bind,src=$task_dir/source,dst=/workspace,readonly" \
            --mount "type=bind,src=$task_dir/out,dst=/workspace/out" \
            wcp-foundation-ci sh SOURCE/daemon/tools/check.sh
      - name: Prove offline gates reject invalid fixtures
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$(cat "$RUNNER_TEMP/wcp-task-dir")"
          docker run --rm --platform linux/amd64 --user 10001:10001 \
            --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --mount "type=bind,src=$task_dir/source,dst=/workspace,readonly" \
            --mount "type=bind,src=$task_dir/out,dst=/workspace/out" \
            wcp-foundation-ci sh SOURCE/daemon/tools/check-negative.sh
      - name: Vulnerability scan with allowlisted service egress
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$(cat "$RUNNER_TEMP/wcp-task-dir")"
          docker network create --ipv6=false --subnet 172.30.99.0/24 \
            --opt com.docker.network.bridge.name=wcp-vuln-br wcp-vuln
          service_ip="$(getent ahostsv4 vuln.go.dev | awk '{print $1}' | sort -u | head -n 1)"
          test -n "$service_ip"
          printf '%s\n' "$service_ip" | sudo tee "$task_dir/out/sc-m01/daemon/vulnerability-service-ips.txt" > /dev/null
          # Host-directed traffic uses INPUT, not Docker's forwarding chain.
          sudo iptables -N WCPHOST
          sudo iptables -A WCPHOST -j REJECT
          sudo iptables -I INPUT 1 -i wcp-vuln-br -s 172.30.99.0/24 -j WCPHOST
          # Empty-directory listener proves the host path is denied, not merely closed.
          mkdir -p "$task_dir/host-probe-root"
          python3 -m http.server 18345 --bind 172.30.99.1 --directory "$task_dir/host-probe-root" \
            > "$task_dir/host-probe.log" 2>&1 &
          printf '%s\n' "$!" > "$task_dir/host-probe.pid"
          curl --noproxy '*' --fail --silent --show-error --retry 8 --retry-connrefused \
            --retry-delay 1 --max-time 2 http://172.30.99.1:18345/ > "$task_dir/host-probe-positive.txt"
          sudo iptables -N WCPVULN
          sudo iptables -I DOCKER-USER 1 -s 172.30.99.0/24 -j WCPVULN
          sudo iptables -A WCPVULN -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A WCPVULN -d "$service_ip" -p tcp --dport 443 -j ACCEPT
          sudo iptables -A WCPVULN -j REJECT
          # A reachable external control proves denial is not endpoint unavailability.
          timeout 5 bash -c 'exec 3<>/dev/tcp/1.1.1.1/443'
          sha256sum /etc/ssl/certs/ca-certificates.crt \
            | sudo tee "$task_dir/out/sc-m01/daemon/scanner-trust-bundle.sha256" > /dev/null
          docker network inspect wcp-vuln \
            | sudo tee "$task_dir/out/sc-m01/daemon/scanner-network.json" > /dev/null
          docker run --rm --platform linux/amd64 --user 10001:10001 \
            --network wcp-vuln --dns 192.0.2.1 --add-host "vuln.go.dev:$service_ip" \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 --sysctl net.ipv6.conf.default.disable_ipv6=1 \
            --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --mount "type=bind,src=$task_dir/source,dst=/workspace,readonly" \
            --mount "type=bind,src=$task_dir/out,dst=/workspace/out" \
            --mount type=bind,src=/etc/ssl/certs/ca-certificates.crt,dst=/etc/ssl/certs/ca-certificates.crt,readonly \
            wcp-foundation-ci sh SOURCE/daemon/tools/scan.sh
          sudo iptables -L WCPVULN -n -v -x \
            | sudo tee "$task_dir/out/sc-m01/daemon/scanner-firewall-counters.txt"
          sudo iptables -L WCPHOST -n -v -x \
            | sudo tee "$task_dir/out/sc-m01/daemon/scanner-host-firewall-counters.txt"
          sudo iptables -L WCPHOST -n -v -x | awk \
            '$3 == "REJECT" && $1 > 0 {denied=1} END {exit !denied}'
          # Prove the positive-control host listener remained alive throughout the scan.
          curl --noproxy '*' --fail --silent --show-error --max-time 2 \
            http://172.30.99.1:18345/ > /dev/null
          # Both allowed scanner traffic and denied probe traffic must traverse this chain.
          sudo iptables -L WCPVULN -n -v -x | awk \
            '$3 == "ACCEPT" && /dpt:443/ && $1 > 0 {allowed=1} $3 == "REJECT" && $1 > 0 {denied=1} END {exit !(allowed && denied)}'
      - name: Verify complete gate inventory
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$RUNNER_TEMP/wcp-foundation"
          printf '%s\n' daemon-toolchain daemon-no-third-party-runtime-deps daemon-mod-tidy \
            daemon-mod-verify daemon-gofmt daemon-vet daemon-unit daemon-inert-import-boundary \
            daemon-build daemon-smoke daemon-reproducible-build daemon-evidence daemon-vulncheck \
            | sort > "$task_dir/expected-gates.txt"
          awk -F '\t' 'NF != 3 || $2 != "PASS" || $3 != "0" {exit 1}' "$task_dir/out/sc-m01/daemon/gates.tsv"
          cut -f1 "$task_dir/out/sc-m01/daemon/gates.tsv" | sort > "$task_dir/actual-gates.txt"
          diff -u "$task_dir/expected-gates.txt" "$task_dir/actual-gates.txt"
      - name: Show gate evidence
        if: always()
        shell: bash
        run: |
          task_dir="$RUNNER_TEMP/wcp-foundation"
          if test -f "$task_dir/out/sc-m01/daemon/gates.tsv"; then
            cat "$task_dir/out/sc-m01/daemon/gates.tsv"
          fi
          for report in cli-process.tsv negative-gates.tsv gofmt.txt vet.txt unit.jsonl vulnerability.txt binary.sha256 provenance.txt scanner-bootstrap.txt scanner-module-verify.txt scanner.sha256 scanner-isolation.txt scanner-firewall-counters.txt scanner-host-firewall-counters.txt scanner-linked-modules.txt; do
            if test -f "$task_dir/out/sc-m01/daemon/$report"; then
              printf '\nReport: %s\n' "$report"
              tail -n 80 "$task_dir/out/sc-m01/daemon/$report"
            fi
          done
      - name: Preserve exact-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sc-m01-daemon-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wcp-foundation/out/sc-m01/daemon/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove scanner network
        if: always()
        shell: bash
        run: |
          task_dir="$RUNNER_TEMP/wcp-foundation"
          if test -f "$task_dir/host-probe.pid"; then
            kill "$(cat "$task_dir/host-probe.pid")" 2>/dev/null || true
          fi
          sudo iptables -D INPUT -i wcp-vuln-br -s 172.30.99.0/24 -j WCPHOST 2>/dev/null || true
          sudo iptables -F WCPHOST 2>/dev/null || true
          sudo iptables -X WCPHOST 2>/dev/null || true
          docker network rm wcp-vuln >/dev/null 2>&1 || true
          sudo iptables -D DOCKER-USER -s 172.30.99.0/24 -j WCPVULN 2>/dev/null || true
          sudo iptables -F WCPVULN 2>/dev/null || true
          sudo iptables -X WCPVULN 2>/dev/null || true
