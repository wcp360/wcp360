name: SC-M01 IPC-B Go research-only framing tests

on:
  pull_request:
    paths:
      - "research/architecture-lab/ipc-b-go-framing/**"
      - ".github/workflows/sc-m01-ipcb-go-research.yml"
      - "specifications/ipc/WCP360_IPC_Contract_WCP360-IPC-B-1_CANONICAL_IMPLEMENTATION_EXPORT.md"

permissions:
  contents: read

jobs:
  go-ipcb-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: research/architecture-lab/ipc-b-go-framing
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record runner Go version (R&D not final toolchain)
        run: go version
      - name: Test bounded IPC-B in-memory Go parser (no OS effects)
        run: go test -count=1 -v ./...
      - name: Static vet of inert research package
        run: go vet ./...
      - name: Bounded fuzz IPC-B request decoder (research only)
        run: go test -run '^ -fuzz '^FuzzDecodeRequestFrameNeverPanics -fuzztime=3s -parallel=1 ./...
      - name: Bounded fuzz IPC-B response decoder (research only)
        run: go test -run '^ -fuzz '^FuzzDecodeResponseFrameNeverPanics -fuzztime=3s -parallel=1 ./...
