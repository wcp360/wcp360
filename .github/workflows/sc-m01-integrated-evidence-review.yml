name: SC-M01 integrated development-source review (noncanonical)

on:
  push:
    branches: [main]
    paths:
      - "tools/governance/**"
      - "research/architecture-lab/sc-m01-control-protocol/**"
      - "documentation/governance/**"
      - "documentation/specifications/**"
      - ".github/workflows/sc-m01-integrated-evidence-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/governance/**"
      - "research/architecture-lab/sc-m01-control-protocol/**"
      - "documentation/governance/**"
      - "documentation/specifications/**"
      - ".github/workflows/sc-m01-integrated-evidence-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-development-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test private-input boundaries and relocated current pins
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/governance -p 'test_sc_m01_historical_inputs.py' -v
          python3 tools/governance/sc_m01_historical_inputs.py --verify-current
      - name: Materialize immutable historical source fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/governance/sc_m01_historical_inputs.py --output "$RUNNER_TEMP/scm01-integrated-inputs"
      - name: Execute historical tooling assertions with strict eight-pin check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "$RUNNER_TEMP/scm01-integrated-inputs/tools/governance" -p 'test_sc_m01_*.py' -v
          python3 "$RUNNER_TEMP/scm01-integrated-inputs/tools/governance/sc_m01_preflight.py" --require-all-pinned --format json
          python3 "$RUNNER_TEMP/scm01-integrated-inputs/tools/governance/sc_m01_contract_traceability.py" --mode check
          python3 "$RUNNER_TEMP/scm01-integrated-inputs/tools/governance/sc_m01_privileged_mapping_check.py"
          python3 "$RUNNER_TEMP/scm01-integrated-inputs/tools/governance/sc_m01_qa_annex_consistency.py" --json
          python3 "$RUNNER_TEMP/scm01-integrated-inputs/tools/governance/sc_m01_qa_single_file_check.py" --json
      - name: Execute inert parser research refusals
        run: python3 -m unittest discover -s research/architecture-lab/sc-m01-control-protocol -p 'test_inert_codec.py' -v

# Development-source integration neither promotes proposals nor supplies E3 review.
# No privileged command, service activation, deployment or production data access.
