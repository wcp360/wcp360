name: SC-M01 contract reference traceability (noncanonical)

on:
  pull_request:
    paths:
      - "tools/governance/sc_m01_contract_traceability.py"
      - "tools/governance/test_sc_m01_contract_traceability.py"
      - "tools/governance/sc_m01_privileged_mapping_check.py"
      - "tools/governance/test_sc_m01_privileged_mapping_check.py"
      - "tools/governance/sc_m01_qa_annex_consistency.py"
      - "tools/governance/test_sc_m01_qa_annex_consistency.py"
      - "governance/handoffs/SC-M01-QA-CANONICAL-COVERAGE-INDEX.json"
      - "governance/proposals/SC-M01-QA-133-TEST-RECORDS-OWNER-CANDIDATE-v0.1.json"
      - "governance/proposals/SC-M01-QA-66-SECURITY-TEST-ANNEX-OWNER-CANDIDATE-v0.1.json"
      - "governance/verification/SC-M01-CONTRACT-TRACEABILITY-2026-10-26.json"
      - "specifications/api/WCP360_API_Contract_v1.0_CANONICAL_IMPLEMENTATION_EXPORT.md"
      - "specifications/ipc/WCP360_IPC_Contract_WCP360-IPC-B-1_CANONICAL_IMPLEMENTATION_EXPORT.md"
      - "specifications/security/WCP360_Permission_Registry_v1.0_CANONICAL_IMPLEMENTATION_EXPORT.md"
      - "specifications/security/WCP360_Security_Baseline_v1.0_CANONICAL_IMPLEMENTATION_EXPORT.md"
      - ".github/workflows/sc-m01-contract-traceability.yml"

permissions:
  contents: read

jobs:
  reference-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python standard library version
        run: python3 --version
      - name: Unit / adversarial validation
        run: python3 -m unittest discover -s tools/governance -p 'test_sc_m01_contract_traceability.py' -v
      - name: Negative Security↔IPC operation/parent binding tests
        run: python3 -m unittest discover -s tools/governance -p 'test_sc_m01_privileged_mapping_check.py' -v
      - name: Verify 47 IPC-B operations against Security source
        run: python3 tools/governance/sc_m01_privileged_mapping_check.py
      - name: 199 noncanonical QA source-linkage and fake-PASS negative tests
        run: python3 -m unittest discover -s tools/governance -p 'test_sc_m01_qa_annex_consistency.py' -v
      - name: Verify owner-review QA reference candidates are pending, not PASS
        run: python3 tools/governance/sc_m01_qa_annex_consistency.py --json
      - name: Verify exact reference traceability snapshot
        run: python3 tools/governance/sc_m01_contract_traceability.py --mode check
      - name: Reference-only summary
        run: python3 tools/governance/sc_m01_contract_traceability.py --mode summary
