name: SC-M01 historical reference traceability (noncanonical)

on:
  push:
    branches: [main]
    paths:
      - "tools/governance/**"
      - "documentation/governance/verification/**"
      - "documentation/specifications/**"
      - ".github/workflows/sc-m01-contract-traceability.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/governance/**"
      - "documentation/governance/verification/**"
      - "documentation/specifications/**"
      - ".github/workflows/sc-m01-contract-traceability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-reference-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout with immutable historical Git inputs available
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare bounded private historical fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scm01-evidence"
          python3 tools/governance/sc_m01_historical_inputs.py --output "$RUNNER_TEMP/scm01-inputs" > "$RUNNER_TEMP/scm01-evidence/historical-provenance.json"
      - name: Run source-binding mutation and fake-PASS refusal tests
        shell: bash
        run: |
          set -euo pipefail
          for test in test_sc_m01_contract_traceability.py test_sc_m01_privileged_mapping_check.py test_sc_m01_qa_annex_consistency.py test_sc_m01_qa_single_file_check.py; do
            python3 -m unittest discover -s "$RUNNER_TEMP/scm01-inputs/tools/governance" -p "$test" -v
          done
      - name: Verify unchanged 86 API, 47 IPC and 82 permission historical snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/scm01-inputs/tools/governance/sc_m01_contract_traceability.py" --mode check
          python3 "$RUNNER_TEMP/scm01-inputs/tools/governance/sc_m01_privileged_mapping_check.py"
          python3 "$RUNNER_TEMP/scm01-inputs/tools/governance/sc_m01_qa_annex_consistency.py" --json > "$RUNNER_TEMP/scm01-evidence/historical-qa-annex.json"
          python3 "$RUNNER_TEMP/scm01-inputs/tools/governance/sc_m01_qa_single_file_check.py" --json > "$RUNNER_TEMP/scm01-evidence/historical-qa-single-file.json"
      - name: Preserve historical reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scm01-historical-references-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scm01-evidence/*.json
          if-no-files-found: error
          retention-days: 30

# Historical proposal consistency is separate from current Core tests and approval.
