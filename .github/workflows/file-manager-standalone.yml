name: File Manager standalone candidate
on:
  push:
    branches: [main]
    paths:
      - 'WCP360_Plugins/wcp360-file-manager-xampp/**'
      - '.github/workflows/file-manager-standalone.yml'
  pull_request:
    branches: [main]
    paths:
      - 'WCP360_Plugins/wcp360-file-manager-xampp/**'
      - '.github/workflows/file-manager-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fm-standalone-${{ github.ref }}
  cancel-in-progress: false
jobs:
  standalone:
    name: standalone-php-${{ matrix.php }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    env:
      FM_PHP_LANE: ${{ matrix.php }}
      FM_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Enforce acquisition and audit egress policy
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP python3 WCP360_Plugins/wcp360-file-manager-xampp/tests/ci/network_host.py setup
      - name: Build candidate test environment from pinned inputs (cold cache)
        id: build
        run: python3 WCP360_Plugins/wcp360-file-manager-xampp/tests/ci/host.py build
      - name: Run offline tests as non-root with sandboxed Chromium
        if: steps.build.outcome == 'success'
        run: python3 WCP360_Plugins/wcp360-file-manager-xampp/tests/ci/host.py test
      - name: Query dependency advisories separately (network required)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo python3 WCP360_Plugins/wcp360-file-manager-xampp/tests/ci/network_host.py audit
          python3 WCP360_Plugins/wcp360-file-manager-xampp/tests/ci/host.py audit
      - name: Restore disposable host networking and retain proxy counters
        if: always()
        run: sudo --preserve-env=RUNNER_TEMP python3 WCP360_Plugins/wcp360-file-manager-xampp/tests/ci/network_host.py cleanup
      - name: Retain structured evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fm-standalone-${{ matrix.php }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fm-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
# This workflow supplies candidate E1 only. No release, deployment, F01 or owner approval.
