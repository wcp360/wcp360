name: Repository guardrails

on:
  pull_request:
    branches: [develop, stable, main, production]
  push:
    branches: [develop, stable, main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitignore-regression:
    name: gitignore-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test forced-tracked ignore-policy violations safely
        shell: bash
        run: python3 -I tools/repository/check_gitignore.py --self-test-tracked
      - name: Check synthetic rules and real tracked-path policy
        shell: bash
        run: python3 -I tools/repository/check_gitignore.py
      - name: Test the publication checker with synthetic Git fixtures
        shell: bash
        run: python3 -I tools/repository/test_publication_checker.py
      - name: Verify disabled branch protection templates and negative fixtures
        shell: bash
        run: python3 -I tools/repository/check_branch_ruleset_templates.py
      - name: Verify read-only live-ruleset audit fixtures
        shell: bash
        run: python3 -I tools/repository/check_live_branch_rulesets.py --self-test
      - name: Verify approved PR branch flow
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 -I tools/repository/check_branch_routing.py --self-test
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 -I tools/repository/check_branch_routing.py --base "$PR_BASE" --head "$PR_HEAD" --number "$PR_NUMBER"
          fi
      - name: Test MFA review-ledger validation and transaction model
        shell: bash
        run: |
          python3 -I tools/repository/test_mfa_alignment.py
          python3 -I tools/repository/test_mfa_transaction_model.py
      - name: Verify source-bound MFA contract traceability without runtime qualification
        shell: bash
        run: python3 -I tools/repository/check_mfa_alignment.py --root . --report publication-evidence/mfa-alignment.json
      - name: Verify API #136 declaration drift without claiming canonical test PASS
        shell: bash
        run: |
          python3 -I tools/repository/test_core_api_136.py
          python3 -I tools/repository/check_core_api_136.py --root .
      - name: Test branding archive validation rules
        shell: bash
        run: python3 -I tools/repository/check_branding_archive.py --self-test
      - name: Verify branding originals when the archive is present
        shell: bash
        run: python3 -I tools/repository/check_branding_archive.py --optional --output publication-evidence/branding.json
      - name: Verify publication and record exact Git inventories
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            read -ra PARENTS <<< "$(git show -s --format='%P' HEAD)"
            [[ "${#PARENTS[@]}" -eq 2 ]]
            [[ "${PARENTS[1]}" == "$CANDIDATE_SHA" ]]
            BASE_SHA="${PARENTS[0]}"
          else
            [[ "$CHECKED_OUT_SHA" == "$CANDIDATE_SHA" ]]
            BASE_SHA="$CHECKED_OUT_SHA"
          fi
          printf 'event_base=%s\ntested_base=%s\ncandidate=%s\nchecked_out=%s\n' "$EVENT_BASE_SHA" "$BASE_SHA" "$CANDIDATE_SHA" "$CHECKED_OUT_SHA"
          python3 -I tools/repository/check_publication.py --inventory-only --ref "$BASE_SHA" --output publication-evidence/base.json
          python3 -I tools/repository/check_publication.py --inventory-only --ref "$CANDIDATE_SHA" --output publication-evidence/candidate.json
          python3 -I tools/repository/check_publication.py --inventory-only --ref "$CHECKED_OUT_SHA" --output publication-evidence/checked-out.json
          if [[ "$EVENT_BASE_SHA" != "$BASE_SHA" ]]; then
            python3 -I tools/repository/check_publication.py --inventory-only --ref "$EVENT_BASE_SHA" --output publication-evidence/event-base-historical.json
          fi
      - name: Verify preserved historical mirror against its own immutable manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tools/repository/check_publication.py --ref fb2a95620f3547007a17bad9b82e18004a413bc8 --output publication-evidence/historical-mirror-fb2a9562.json
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wcp360-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-evidence/*.json
          if-no-files-found: error
          retention-days: 30

  repository-secrets:
    name: repository-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tested snapshot without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test secret detection and safe reporting with synthetic fixtures
        shell: bash
        run: python3 -I tools/repository/test_repository_secrets.py
      - name: Test staged-index scans and opt-in pre-commit hook
        shell: bash
        run: python3 -I tools/repository/test_staged_repository_secrets.py
      - name: Verify opt-in hook is executable but not auto-installed
        shell: bash
        run: |
          set -euo pipefail
          mode="$(git ls-files --stage -- .githooks/pre-commit | cut -d' ' -f1)"
          [[ "$mode" == "100755" ]]
          [[ -f .githooks/pre-commit && -x .githooks/pre-commit ]]
          if git config --local --get core.hooksPath >/dev/null; then
            printf '%s\n' 'HOOKS_AUTO_INSTALL_FORBIDDEN' >&2
            exit 1
          fi
      - name: Inspect committed snapshot for selected secret patterns
        shell: bash
        run: python3 -I tools/repository/check_repository_secrets.py --ref HEAD --output "$RUNNER_TEMP/wcp360-repository-secrets.json"
      - name: Preserve redacted secret-check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wcp360-repository-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wcp360-repository-secrets.json
          if-no-files-found: error
          retention-days: 30

# Repository maintenance only: not WCP360 application QA or Debian certification.
# Missing branding originals remain NOT_PUBLISHED in the optional report.
# For PRs, base.json describes the first parent of the actual tested merge.
# Different historical event-base metadata is retained under a distinct filename.
# Inventories contain paths, sizes and hashes, not source file bodies or credentials.
# Secret checks emit neither detected values nor raw filenames; not a full audit.
# No deployment, repository writes, production secrets, or privileged runner.
# A workflow file does not itself enforce branch protection or required reviews.

# Current inventory-only reports do not certify the retired mirror or legacy audit.
# The separate pinned historical report retains all original strict mirror assertions.
