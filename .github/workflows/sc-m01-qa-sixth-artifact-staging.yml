name: SC-M01 QA sixth-artifact final owner integrity
on:
  pull_request:
    paths:
      - ".github/workflows/sc-m01-qa-sixth-artifact-staging.yml"
      - "specifications/tests/WCP360_SC-M01_Test_Baseline_v1.0_CANONICAL_IMPLEMENTATION_EXPORT.md"
permissions:
  contents: read
jobs:
  qa-owner-final-artifact-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout final owner artifact without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify final QA owner publication metadata and coverage
        shell: bash
        run: |
          python3 -I - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("specifications/tests/WCP360_SC-M01_Test_Baseline_v1.0_CANONICAL_IMPLEMENTATION_EXPORT.md")
          text = path.read_text(encoding="utf-8")

          required = [
              "FINAL APPROVED — CANONICAL IMPLEMENTATION AUTHORITY",
              "P2 — FIRST CANONICAL MATERIALIZATION / OWNER APPROVAL",
              "CONTENT CHANGE = INITIAL CANONICAL CONTENT",
              "TEST BASELINE VERSION = v1.0",
              "FINAL APPROVED CONTENT = YES",
              "A01–A20 = INDIVIDUALLY DECIDED",
              "QI01–QI07 = INDIVIDUALLY DECIDED",
              "API RECORDS VERIFIED = 86 / 86",
              "IPC RECORDS VERIFIED = 47 / 47",
              "N LABELS VERIFIED = 26 / 26",
              "WEB MAPPINGS APPROVED = 40 / 40",
              "HISTORICAL PROPOSALS TRIAGED = 85 / 85",
              "HISTORICAL TRIAGE = 64 MERGE / 21 BLOCKED",
              "PRODUCT TESTS ACTUALLY EXECUTED = 0",
              "RESULT PASS = 0",
              "RESULT FAIL = 0",
              "CODE-BASELINE = NONE",
              "MASTER GATE = 5/8 UNTIL MASTER VERIFIES THIS PUBLICATION",
          ]
          for value in required:
              assert value in text, f"missing required final QA marker: {value}"

          groups = {
              "TEST-API": set(re.findall(r"\bTEST-API-[0-9]{4}\b", text)),
              "TEST-IPC": set(re.findall(r"\bTEST-IPC-[0-9]{4}\b", text)),
              "TEST-SEC-WEB": set(re.findall(r"\bTEST-SEC-WEB-[0-9]{3}\b", text)),
              "N": set(re.findall(r"\bN(?:0[1-9]|1[0-9]|2[0-6])\b", text)),
          }
          expected = {"TEST-API": 86, "TEST-IPC": 47, "TEST-SEC-WEB": 40, "N": 26}
          actual = {k: len(v) for k, v in groups.items()}
          assert actual == expected, f"QA identifier coverage mismatch: {actual}"

          a_ids = set(re.findall(r"\*\*(A(?:0[1-9]|1[0-9]|20))\*\* \| \*\*(?:ACCEPT|AMEND|REJECT)\*\*", text))
          qi_ids = set(re.findall(r"\*\*(QI-0[1-7])\*\* \| \*\*(?:ACCEPT|AMEND|REJECT)\*\*", text))
          assert len(a_ids) == 20, f"A01-A20 owner decisions incomplete: {len(a_ids)}"
          assert len(qi_ids) == 7, f"QI01-QI07 owner decisions incomplete: {len(qi_ids)}"

          triage = re.findall(r"^\| `(?:C(?:0[1-9]|1[0-7])|TQ(?:0[1-9]|10)|CQ(?:0[1-9]|1[0-2])|HQ(?:0[1-9]|1[0-5])|SQ(?:0[1-9]|1[0-6])|FQ(?:0[1-9]|1[0-5]))` \| \*\*(MERGE|BLOCKED)\*\*", text, re.M)
          assert len(triage) == 85, f"historical triage count changed: {len(triage)}"
          assert triage.count("MERGE") == 64, f"MERGE count changed: {triage.count('MERGE')}"
          assert triage.count("BLOCKED") == 21, f"BLOCKED count changed: {triage.count('BLOCKED')}"

          forbidden = [
              "PENDING QA TRIAGE",
              "OWNER NOT APPROVED",
              "## PART VI-A — 85 source-exact historical proposal scenario rows",
              "MASTER gate:** 6/8",
          ]
          for value in forbidden:
              assert value not in text, f"forbidden stale/premature marker present: {value}"

          assert not re.search(r"RESULT PASS\s*=\s*[1-9]", text)
          assert not re.search(r"RESULT FAIL\s*=\s*[1-9]", text)
          assert not re.search(r"Actual execution:\s*`?(?:PASS|FAIL)\b", text, re.I)

          print("FINAL QA OWNER ARTIFACT INTEGRITY OK")
          print("86 API + 47 IPC + 26 N + 40 WEB = 199 references")
          print("A01-A20 = 20 decisions; QI01-QI07 = 7 decisions")
          print("85 historical labels = 64 MERGE + 21 BLOCKED")
          print("PRODUCT EXECUTION = 0; PASS = 0; FAIL = 0; CODE-BASELINE = NONE")
          print("This workflow is document-integrity evidence, not product-test PASS or independent E3.")
          PY
