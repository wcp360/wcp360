        304:
          description: 'ETag unchanged; empty body'
        404:
          description: 'Public package not found'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        422:
          description: 'Unknown, nested, oversized or invalid query'
          content:
            application/json:
