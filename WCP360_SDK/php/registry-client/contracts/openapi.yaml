          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        429:
          description: 'Native API rate limit; native error envelope may differ'
  '/packages/{type}/{slug}':
    get:
      operationId: package
      security: {  }
      parameters:
        -
          name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 1024
        -
          name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - plugin
              - module
              - app
              - core
        -
          name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        200:
          description: 'Public metadata; installation and distribution unavailable'
          content:
            application/json:
              schema:
