  /updates:
    get:
      operationId: updates
      security: {  }
      parameters:
        -
          name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 1024
        -
          name: channel
          in: query
          required: false
          schema:
            type: string
            enum:
              - stable
              - beta
              - nightly
            default: stable
        -
          name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - plugin
              - module
              - app
              - core
        -
          name: slug
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        -
          name: current_version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
        -
          name: core_version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
        -
          name: php_version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
        -
          name: api_version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
        -
          name: sdk_version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
        -
          name: os
          in: query
          required: true
          schema:
            type: string
            enum:
              - debian-12
              - debian-13
              - ubuntu-22.04
              - ubuntu-24.04
              - ubuntu-26.04
        -
          name: architecture
          in: query
          required: true
          schema:
            type: string
            enum:
              - amd64
              - arm64
      responses:
        200:
          description: 'Public metadata; installation and distribution unavailable'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/UpdateEnvelope'
        304:
          description: 'ETag unchanged; empty body'
        404:
          description: 'Public package not found'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        422:
          description: 'Unknown, nested, oversized or invalid query'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        503:
          description: 'Invalid or unavailable public metadata'
          content:
            application/json:
              schema:
