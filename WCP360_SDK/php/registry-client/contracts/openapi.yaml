        -
          name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        -
          name: channel
          in: query
          required: false
          schema:
            type: string
            enum:
              - stable
              - beta
              - nightly
      responses:
        200:
          description: 'Public metadata; installation and distribution unavailable'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ReleasesEnvelope'
        304:
          description: 'ETag unchanged; empty body'
        404:
          description: 'Public package not found'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        422:
          description: 'Unknown, nested, oversized or invalid query'
          content:
            application/json:
