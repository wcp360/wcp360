openapi: 3.1.0
info:
  title: 'WCP360 vendor Registry — candidate, not the Core API'
  version: 0.1.0
  description: 'Read-only editorial metadata. No artifacts, entitlement checks, installer, telemetry or Core permissions. Unknown query keys are rejected. All success responses expose contract_status=candidate.'
servers:
  -
    url: /api/v1/wcp360-registry
    description: 'Append to the Grav installation base path (e.g. /grav locally)'
paths:
  /status:
    get:
      operationId: status
      security: {  }
      parameters:
        -
          name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 1024
      responses:
        200:
          description: 'Public metadata; installation and distribution unavailable'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/StatusEnvelope'
        304:
          description: 'ETag unchanged; empty body'
        404:
          description: 'Public package not found'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        422:
          description: 'Unknown, nested, oversized or invalid query'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        503:
          description: 'Invalid or unavailable public metadata'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        429:
          description: 'Native API rate limit; native error envelope may differ'
  /catalog/plugins:
    get:
      operationId: plugins
      security: {  }
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        -
          name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 1024
        -
          name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 160
        -
          name: pricing
          in: query
          required: false
          schema:
            type: string
            enum:
              - free
              - paid
              - trial
              - freemium
              - opensource
      responses:
        200:
          description: 'Public metadata; installation and distribution unavailable'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/PackagesEnvelope'
        304:
          description: 'ETag unchanged; empty body'
        404:
          description: 'Public package not found'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        422:
          description: 'Unknown, nested, oversized or invalid query'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        503:
          description: 'Invalid or unavailable public metadata'
          content:
            application/json:
              schema:
                $ref: './response.schema.json#/$defs/ErrorEnvelope'
        429:
          description: 'Native API rate limit; native error envelope may differ'
  /catalog/modules:
    get:
